<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港公共交通即時到站查詢</title>
  <style>
    :root {
      --kmb-red: #E31836;
      --ctb-yellow: #F5A623;
      --ctb-blue: #00529B;
      --gmb-green: #00875A;
      --bg-color: #F4F6F8;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

    .app-container {
      width: 100%; max-width: 480px; background-color: var(--card-bg); min-height: 100vh;
      box-shadow: 0 0 15px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column;
    }

    header { background-color: #2D3748; color: white; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
    header.kmb { background-color: var(--kmb-red); }
    header.ctb { background-color: var(--ctb-blue); }
    header.gmb { background-color: var(--gmb-green); }

    .header-content { display: flex; align-items: center; gap: 12px; }
    .header-title-group { display: flex; flex-direction: column; flex: 1; }
    .header-main-title { font-size: 1.1rem; font-weight: bold; }
    .header-sub-title { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }

    .step-panel { padding: 16px; display: none; flex-direction: column; gap: 16px; flex: 1; }
    .step-panel.active { display: flex; }

    h2 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 8px; }

    .btn-option {
      background: white; border: 2px solid #E2E8F0; border-radius: 8px; padding: 12px 14px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: all 0.2s ease;
    }
    .btn-option.state-loading { opacity: 0.6; cursor: not-allowed; background-color: #EDF2F7; }
    .btn-option.state-failed { border-color: #E53E3E; background-color: #FFF5F5; color: #C53030; }

    .op-tag { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; }
    .op-kmb { background-color: var(--kmb-red); }
    .op-ctb { background-color: var(--ctb-yellow); color: #000; }
    .op-gmb { background-color: var(--gmb-green); }

    input[type="text"] { width: 100%; padding: 14px; border: 2px solid #CBD5E0; border-radius: 8px; font-size: 1.1rem; outline: none; text-transform: uppercase; }
    .primary-btn { background-color: #2D3748; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; }

    .timeline-container { position: relative; padding-left: 24px; margin-top: 8px; }
    .timeline-container::before { content: ''; position: absolute; left: 7px; top: 15px; bottom: 25px; width: 3px; background-color: #E2E8F0; }

    .stop-item { position: relative; margin-bottom: 12px; background: white; border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden; }
    .stop-header { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; }
    .stop-dot { position: absolute; left: -21px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background-color: white; border: 3px solid #718096; z-index: 2; }
    .stop-item.expanded { border-color: #4A5568; }
    .stop-detail-panel { display: none; padding: 12px; background-color: #F8FAFC; border-top: 1px solid #E2E8F0; }
    .stop-item.expanded .stop-detail-panel { display: block; }

    .eta-block { background: white; border: 1px solid #E2E8F0; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .eta-block.target-highlight { border: 2px solid #4A5568; background-color: #EDF2F7; }
    .eta-block-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .badge-target { background-color: #4A5568; color: white; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
    .eta-list-row { display: flex; gap: 8px; justify-content: space-between; }
    .eta-pill { flex: 1; background: #EDF2F7; padding: 6px; border-radius: 4px; text-align: center; }
    .eta-time { font-size: 0.95rem; font-weight: bold; }
    .eta-wait { font-size: 0.75rem; color: var(--text-sub); }

    .retry-btn-inline { background: #E53E3E; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }

    #loading-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
    .spinner { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: #2D3748; border-radius: 50%; animation: rotation 1s linear infinite; margin-bottom: 16px; }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .nav-back { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <header id="app-header">
      <div class="header-content">
        <button id="btn-back" class="nav-back" style="display:none;" onclick="goBack()">←</button>
        <div class="header-title-group">
          <div id="header-main" class="header-main-title">香港公共交通即時到站查詢</div>
          <div id="header-sub" class="header-sub-title" style="display:none;"></div>
        </div>
      </div>
    </header>

    <div id="step-2" class="step-panel active">
      <h2>輸入路線號碼</h2>
      <input type="text" id="route-input" placeholder="例如：73X, 1, 107, 16M" onkeypress="if(event.key==='Enter') submitRoute()"/>
      <button class="primary-btn" onclick="submitRoute()">跨機構查詢路線</button>
    </div>

    <div id="step-3" class="step-panel">
      <h2>請選擇機構與行駛方向</h2>
      <div id="bound-list" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>

    <div id="step-4" class="step-panel">
      <h2>請點擊車站查看實時到站時間</h2>
      <div class="timeline-container" id="stops-timeline"></div>
      <div id="update-timer" style="font-size:0.85rem; color:#777; text-align:center; margin-top:8px;">--</div>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">正在讀取數據...</div>
  </div>

  <script>
    let currentStep = 2;
    let searchedRouteInput = '';
    let selectedRouteItem = null; 
    let routeStops = [];
    let expandedStopIndex = null;
    let autoRefreshTimer = null;
    let step3AbortController = null;

    let singleStopFailCount = 0;
    let isAutoPollingPaused = false;

    const API_KMB = "https://data.etabus.gov.hk/v1/transport/kmb";
    const API_CTB = "https://data.etabus.gov.hk/v1/transport/citybus-nwfb";
    const API_GMB = "https://data.etagmb.gov.hk";

    function showLoading(msg) {
      document.getElementById('loading-text').innerText = msg;
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
    }

    async function apiFetch(targetUrl, signal = null) {
      const proxyUrl = `/api/bus?url=${encodeURIComponent(targetUrl)}`;
      const res = await fetch(proxyUrl, { signal });
      if (!res.ok) throw new Error(`Status ${res.status}`);
      return await res.json();
    }

    function updateHeader() {
      const header = document.getElementById('app-header');
      const mainTitle = document.getElementById('header-main');
      const subTitle = document.getElementById('header-sub');
      header.className = '';

      if (currentStep === 2) {
        mainTitle.innerText = "香港公共交通即時到站查詢";
        subTitle.style.display = 'none';
      } else if (currentStep === 3) {
        mainTitle.innerText = `搜尋路線：${searchedRouteInput}`;
        subTitle.innerText = "請選擇服務機構與班次方向";
        subTitle.style.display = 'block';
      } else if (currentStep === 4 && selectedRouteItem) {
        const item = selectedRouteItem;
        if(item.company === 'KMB') header.classList.add('kmb');
        else if(item.company === 'CTB') header.classList.add('ctb');
        else header.classList.add('gmb');

        mainTitle.innerText = `[${item.companyName}] ${item.route}`;
        subTitle.innerText = `${item.descText}：${item.orig} 往 ${item.dest}`;
        subTitle.style.display = 'block';
      }
    }

    function goToStep(step) {
      if (currentStep === 3 && step !== 3 && step3AbortController) {
        step3AbortController.abort();
        step3AbortController = null;
      }

      currentStep = step;
      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
      document.getElementById('btn-back').style.display = step > 2 ? 'block' : 'none';
      updateHeader();

      if (step !== 4 && autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    function goBack() { if (currentStep > 2) goToStep(currentStep - 1); }

    async function submitRoute() {
      const input = document.getElementById('route-input').value.trim().toUpperCase();
      if (!input) return alert("請輸入路線號碼！");

      searchedRouteInput = input;
      showLoading(`正在搜尋路線 ${input}...`);
      
      if(step3AbortController) step3AbortController.abort();
      step3AbortController = new AbortController();
      const signal = step3AbortController.signal;

      const container = document.getElementById('bound-list');
      container.innerHTML = '';

      goToStep(3);

      fetchKmbRoutes(searchedRouteInput, signal, container);
      fetchCtbRoutes(searchedRouteInput, signal, container);
      fetchGmbRoutes(searchedRouteInput, signal, container);

      hideLoading();
    }

    async function fetchKmbRoutes(route, signal, container) {
      const btn = createPlaceholderBtn(container, '九巴/龍運', 'op-kmb');
      let attempt = 0;

      const execute = async () => {
        while (attempt < 3) {
          try {
            const res = await apiFetch(`${API_KMB}/route/`, signal);
            const matches = (res.data || []).filter(r => r.route === route);
            btn.remove();
            if (matches.length === 0) return; // 無路線直接隱藏

            matches.forEach(r => {
              renderSuccessButton(container, {
                company: 'KMB', companyCode: 'KMB', companyName: '九巴/龍運', tagClass: 'op-kmb', route: r.route,
                bound: r.bound === 'O' ? 'outbound' : 'inbound', serviceType: r.service_type,
                orig: r.orig_tc, dest: r.dest_tc,
                descText: r.service_type === '1' ? '常規班次' : `特別班次 ${r.service_type}`
              });
            });
            return;
          } catch(e) {
            if (e.name === 'AbortError') return;
            attempt++;
            if (attempt < 3) {
              updatePlaceholderText(btn, '九巴/龍運', 'op-kmb', `資料讀取中 (重試 ${attempt}/3)...`);
              await new Promise(r => setTimeout(r, 3000));
            }
          }
        }

        // 3次失敗變紅
        setFailedBtn(btn, '九巴/龍運', 'op-kmb', async () => {
          setLoadingBtn(btn, '九巴/龍運', 'op-kmb', '手動重試中 (0/3)...');
          attempt = 0;
          await execute();
        });
      };

      execute();
    }

    async function fetchCtbRoutes(route, signal, container) {
      const btn = createPlaceholderBtn(container, '城巴', 'op-ctb');
      let attempt = 0;

      const tryFetch = async () => {
        try {
          const res = await apiFetch(`${API_CTB}/route/CTB/${route}`, signal);
          if (res.data) return { data: res.data, code: 'CTB' };
        } catch(e) {
          if (e.name === 'AbortError') throw e;
          // CTB 回應 422 則自動備援切換 NWFB
          try {
            const res2 = await apiFetch(`${API_CTB}/route/NWFB/${route}`, signal);
            if (res2.data) return { data: res2.data, code: 'NWFB' };
          } catch(e2) {
            if (e2.name === 'AbortError') throw e2;
            if (e.message.includes('422') && e2.message.includes('422')) {
              throw new Error('NO_ROUTE'); // 雙方皆 422 代表確定無此路線
            }
          }
        }
        throw new Error('FETCH_FAILED');
      };

      const execute = async () => {
        while (attempt < 3) {
          try {
            const result = await tryFetch();
            btn.remove();
            const r = result.data;
            renderSuccessButton(container, {
              company: 'CTB', companyCode: result.code,
              companyName: result.code === 'NWFB' ? '新巴/城巴' : '城巴', tagClass: 'op-ctb',
              route: r.route, bound: 'outbound', orig: r.orig_tc, dest: r.dest_tc, descText: '往目的地'
            });
            renderSuccessButton(container, {
              company: 'CTB', companyCode: result.code,
              companyName: result.code === 'NWFB' ? '新巴/城巴' : '城巴', tagClass: 'op-ctb',
              route: r.route, bound: 'inbound', orig: r.dest_tc, dest: r.orig_tc, descText: '往起點'
            });
            return;
          } catch(err) {
            if (err.name === 'AbortError') return;
            if (err.message === 'NO_ROUTE') {
              btn.remove(); // 確定無此路線直接隱藏
              return;
            }
            attempt++;
            if (attempt < 3) {
              updatePlaceholderText(btn, '城巴', 'op-ctb', `資料讀取中 (重試 ${attempt}/3)...`);
              await new Promise(r => setTimeout(r, 3000));
            }
          }
        }

        setFailedBtn(btn, '城巴', 'op-ctb', async () => {
          setLoadingBtn(btn, '城巴', 'op-ctb', '手動重試中 (0/3)...');
          attempt = 0;
          await execute();
        });
      };

      execute();
    }

    async function fetchGmbRoutes(route, signal, container) {
      const gmbRegions = [
        { code: 'HKI', name: '港島小巴' },
        { code: 'KLN', name: '九龍小巴' },
        { code: 'NT',  name: '新界小巴' }
      ];

      gmbRegions.forEach((reg) => {
        const btn = createPlaceholderBtn(container, reg.name, 'op-gmb');
        let attempt = 0;

        const execute = async () => {
          while (attempt < 3) {
            try {
              const res = await apiFetch(`${API_GMB}/route/${reg.code}/${route}`, signal);
              const items = res.data || [];
              btn.remove();

              if (items.length === 0) return;

              for(let rObj of items) {
                const detailRes = await apiFetch(`${API_GMB}/route/${rObj.route_id}`, signal);
                (detailRes.data || []).forEach(rt => {
                  (rt.directions || []).forEach(dir => {
                    renderSuccessButton(container, {
                      company: 'GMB', companyCode: 'GMB', companyName: reg.name, tagClass: 'op-gmb', route: route,
                      routeId: rObj.route_id, routeSeq: rt.route_seq || 1,
                      orig: dir.orig_tc, dest: dir.dest_tc,
                      descText: dir.is_circular ? `循環線 (經 ${dir.dest_tc})` : `常規/特別班次`
                    });
                  });
                });
              }
              return;
            } catch(e) {
              if (e.name === 'AbortError') return;
              attempt++;
              if (attempt < 3) {
                updatePlaceholderText(btn, reg.name, 'op-gmb', `資料讀取中 (重試 ${attempt}/3)...`);
                await new Promise(r => setTimeout(r, 3000));
              }
            }
          }

          setFailedBtn(btn, reg.name, 'op-gmb', async () => {
            setLoadingBtn(btn, reg.name, 'op-gmb', '手動重試中 (0/3)...');
            attempt = 0;
            await execute();
          });
        };

        execute();
      });
    }

    function createPlaceholderBtn(container, name, tagClass) {
      const btn = document.createElement('button');
      btn.className = 'btn-option state-loading';
      btn.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span class="op-tag ${tagClass}">${name}</span><span>資料讀取中 (重試 0/3)...</span></div>`;
      container.appendChild(btn);
      return btn;
    }

    function updatePlaceholderText(btn, name, tagClass, text) {
      btn.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span class="op-tag ${tagClass}">${name}</span><span>${text}</span></div>`;
    }

    function setLoadingBtn(btn, name, tagClass, text) {
      btn.className = 'btn-option state-loading';
      btn.onclick = null;
      updatePlaceholderText(btn, name, tagClass, text);
    }

    function setFailedBtn(btn, name, tagClass, retryCallback) {
      btn.className = 'btn-option state-failed';
      updatePlaceholderText(btn, name, tagClass, '載入失敗，點擊手動重試');
      btn.onclick = retryCallback;
    }

    function renderSuccessButton(container, item) {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="op-tag ${item.tagClass}">${item.companyName}</span>
          <span>${item.descText}：${item.orig} 往 ${item.dest}</span>
        </div>
        <span>→</span>
      `;
      btn.onclick = () => selectRouteDirection(item);
      container.appendChild(btn);
    }

    async function selectRouteDirection(item) {
      selectedRouteItem = item;
      showLoading(`正在載入車站列表...`);

      try {
        routeStops = [];

        if (item.company === 'KMB') {
          const rawData = await apiFetch(`${API_KMB}/route-stop/${item.route}/${item.bound}/${item.serviceType}`);
          const stopPromises = (rawData.data || []).map(s => apiFetch(`${API_KMB}/stop/${s.stop}`));
          const stopDetails = await Promise.all(stopPromises);
          routeStops = (rawData.data || []).map((s, idx) => ({ seq: parseInt(s.seq), stopId: s.stop, name: stopDetails[idx].data ? stopDetails[idx].data.name_tc : "車站" }));

        } else if (item.company === 'CTB') {
          const rawData = await apiFetch(`${API_CTB}/route-stop/${item.companyCode}/${item.route}/${item.bound}`);
          const stopPromises = (rawData.data || []).map(s => apiFetch(`${API_CTB}/stop/${s.stop}`));
          const stopDetails = await Promise.all(stopPromises);
          routeStops = (rawData.data || []).map((s, idx) => ({ seq: parseInt(s.seq), stopId: s.stop, name: stopDetails[idx].data ? stopDetails[idx].data.name_tc : "車站" }));

        } else if (item.company === 'GMB') {
          const rawData = await apiFetch(`${API_GMB}/route-stop/${item.routeId}/${item.routeSeq}`);
          const stopPromises = (rawData.data || []).map(s => {
            if (!s.stop_id) return Promise.resolve(null);
            return apiFetch(`${API_GMB}/stop/${s.stop_id}`).catch(() => null);
          });
          const stopDetails = await Promise.all(stopPromises);

          routeStops = (rawData.data || []).map((s, idx) => {
            const seqNum = parseInt(s.stop_seq || idx + 1);
            const stopName = (stopDetails[idx] && stopDetails[idx].data && stopDetails[idx].data.name_tc) 
              ? stopDetails[idx].data.name_tc 
              : `[第 ${seqNum} 站 - 站名缺失]`;
            return {
              seq: seqNum,
              stopId: s.stop_id || null,
              name: stopName
            };
          });
        }

        renderTimeline();
        hideLoading();
        goToStep(4);

        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
        singleStopFailCount = 0;
        isAutoPollingPaused = false;

        autoRefreshTimer = setInterval(() => {
          if (expandedStopIndex !== null && !isAutoPollingPaused) {
            fetchAndRenderAdjacentETAs(expandedStopIndex, false);
          }
        }, 15000);

      } catch (e) {
        hideLoading();
        alert("載入車站失敗：" + e.message);
      }
    }

    function renderTimeline() {
      const container = document.getElementById('stops-timeline');
      container.innerHTML = '';
      expandedStopIndex = null;

      routeStops.forEach((st, index) => {
        const item = document.createElement('div');
        item.className = 'stop-item';
        item.id = `stop-item-${index}`;
        item.innerHTML = `
          <div class="stop-dot"></div>
          <div class="stop-header" onclick="toggleStop(${index})">
            <span>${st.seq}. ${st.name}</span>
            <span id="stop-arrow-${index}">▼</span>
          </div>
          <div class="stop-detail-panel" id="stop-detail-${index}">
            <div id="stop-eta-content-${index}">正在載入到站時間...</div>
          </div>
        `;
        container.appendChild(item);
      });
      document.getElementById('update-timer').innerText = '--';
    }

    function toggleStop(index) {
      const targetItem = document.getElementById(`stop-item-${index}`);
      const isAlreadyExpanded = targetItem.classList.contains('expanded');

      document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('expanded'));
      document.querySelectorAll('[id^="stop-arrow-"]').forEach(el => el.innerText = '▼');

      if (!isAlreadyExpanded) {
        targetItem.classList.add('expanded');
        document.getElementById(`stop-arrow-${index}`).innerText = '▲';
        expandedStopIndex = index;
        singleStopFailCount = 0;
        isAutoPollingPaused = false;
        fetchAndRenderAdjacentETAs(index, false);
      } else {
        expandedStopIndex = null;
      }
    }

    async function fetchSingleStopETA(stopObj) {
      if (!stopObj.stopId) {
        return { missingStopId: true };
      }

      const item = selectedRouteItem;
      if (item.company === 'KMB') {
        const res = await apiFetch(`${API_KMB}/eta/${stopObj.stopId}/${item.route}/${item.serviceType}`);
        const dir = item.bound === 'outbound' ? 'O' : 'I';
        return (res.data || []).filter(e => e.dir === dir && e.eta).map(e => e.eta);

      } else if (item.company === 'CTB') {
        const res = await apiFetch(`${API_CTB}/eta/${item.companyCode}/${stopObj.stopId}/${item.route}`);
        const dir = item.bound === 'outbound' ? 'O' : 'I';
        return (res.data || []).filter(e => e.dir === dir && e.eta).map(e => e.eta);

      } else if (item.company === 'GMB') {
        const res = await apiFetch(`${API_GMB}/eta/route-stop/${item.routeId}/${item.routeSeq}/${stopObj.seq}`);
        const etas = [];
        ((res.data && res.data.eta) || []).forEach(e => { if(e.timestamp) etas.push(e.timestamp); });
        return etas;
      }
    }

    async function fetchAndRenderAdjacentETAs(targetIndex, isManualRetry = false) {
      const detailContainer = document.getElementById(`stop-eta-content-${targetIndex}`);
      const prevIndex = targetIndex > 0 ? targetIndex - 1 : null;
      const currIndex = targetIndex;
      const nextIndex = targetIndex < routeStops.length - 1 ? targetIndex + 1 : null;

      if (!isManualRetry) {
        detailContainer.innerHTML = `<div style="font-size:0.85rem; color:#666;">獲取班次數據中...</div>`;
      }

      try {
        const currEtas = await fetchSingleStopETA(routeStops[currIndex]);
        let htmlContent = renderETABlock(routeStops[currIndex], currEtas, 'curr');

        let adjHtml = '';
        if (prevIndex !== null) {
          const prevEtas = await fetchSingleStopETA(routeStops[prevIndex]);
          adjHtml += renderETABlock(routeStops[prevIndex], prevEtas, 'prev');
        }
        if (nextIndex !== null) {
          const nextEtas = await fetchSingleStopETA(routeStops[nextIndex]);
          adjHtml += renderETABlock(routeStops[nextIndex], nextEtas, 'next');
        }

        detailContainer.innerHTML = htmlContent + adjHtml;
        document.getElementById('update-timer').innerText = `最後更新時間：${new Date().toLocaleTimeString()}`;

        singleStopFailCount = 0;

      } catch(e) {
        if (!isManualRetry) {
          singleStopFailCount++;
        }

        if (singleStopFailCount >= 3) {
          isAutoPollingPaused = true;
          detailContainer.innerHTML = `
            <div style="font-size:0.85rem; color:#E53E3E; padding:8px 0; display:flex; justify-content:space-between; align-items:center;">
              <span>連續 3 次獲取失敗，自動更新已暫停</span>
              <button class="retry-btn-inline" onclick="fetchAndRenderAdjacentETAs(${targetIndex}, true)">手動重試</button>
            </div>
          `;
        } else {
          detailContainer.innerHTML = `<div style="font-size:0.85rem; color:#888; padding:8px 0;">暫無法獲取即時班次，等待下一輪更新 (${singleStopFailCount}/3)...</div>`;
        }
      }
    }

    function renderETABlock(stopObj, etas, type) {
      const isTarget = type === 'curr';
      const titleLabel = type === 'prev' ? `前一站：${stopObj.name}` : (type === 'next' ? `後一站：${stopObj.name}` : `${stopObj.name}`);

      let block = `
        <div class="eta-block ${isTarget ? 'target-highlight' : ''}">
          <div class="eta-block-title">
            <span>${stopObj.seq}. ${titleLabel}</span>
            ${isTarget ? '<span class="badge-target">本站預測</span>' : ''}
          </div>
          <div class="eta-list-row">
      `;

      if (etas && etas.missingStopId) {
        block += `<div style="font-size:0.85rem; color:#C53030; padding:4px;">站點代碼缺失，無法預測到站</div>`;
      } else if (!etas || etas.length === 0) {
        block += `<div style="font-size:0.85rem; color:#888; padding:4px;">暫無實時數據</div>`;
      } else {
        etas.slice(0, 3).forEach(etaStr => {
          const timeObj = new Date(etaStr);
          const timeFormat = timeObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const waitMins = Math.max(0, Math.round((timeObj - new Date()) / 60000));
          block += `
            <div class="eta-pill">
              <div class="eta-time">${timeFormat}</div>
              <div class="eta-wait">${waitMins}分鐘</div>
            </div>
          `;
        });
      }
      block += `</div></div>`;
      return block;
    }
  </script>
</body>
</html>
